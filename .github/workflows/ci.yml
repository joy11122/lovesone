name: LOVESONE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lovesone-marketplace-development/lovesone
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/lovesone?replicaSet=rs0
      AUTH_SECRET: ci-only-not-a-production-secret
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lovesone-marketplace-development/lovesone/package.json
      - name: Start MongoDB replica set
        run: |
          docker run -d --name lovesone-mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all

          for attempt in $(seq 1 30); do
            if docker exec lovesone-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec lovesone-mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"

          for attempt in $(seq 1 30); do
            if docker exec lovesone-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB replica set did not become primary in time."
          docker logs lovesone-mongodb
          exit 1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and database integration tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
